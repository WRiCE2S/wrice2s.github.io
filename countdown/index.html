<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to WRiCE</title>
  <meta name="description" content="Live countdown to the WRiCE Cruise Kick-Off on 5 January 2029.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="countdown-page">
    <div class="ocean-backdrop" aria-hidden="true"></div>

    <div class="countdown-card">
      <p class="eyebrow">WRiCE Research Expedition</p>
      <h1>Countdown to WRiCE</h1>
      <p class="subtitle">Cruise Kick-Off — 5 January 2029, 00:00 UT</p>

      <div id="countdown" class="countdown-grid" role="timer" aria-live="polite" aria-label="Time remaining until WRiCE Cruise Kick-Off">
        <div class="countdown-block">
          <span class="countdown-value" id="days">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-block">
          <span class="countdown-value" id="hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-block">
          <span class="countdown-value" id="minutes">00</span>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-block">
          <span class="countdown-value" id="seconds">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>

      <p id="countdown-complete" class="complete-message" hidden>
        The WRiCE Cruise is underway.
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
