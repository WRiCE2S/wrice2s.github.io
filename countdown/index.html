<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to WRiCE²S</title>
  <meta name="description" content="Live countdown to the WRiCE²S Cruise Kick-Off on 5 January 2029.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="countdown-page">
    <div class="ocean-backdrop" aria-hidden="true"></div>

    <div class="countdown-card">
      <p class="eyebrow">WRiCE²S Research Expedition</p>
      <h1>Countdown to WRiCE²S</h1>
      <p class="subtitle">WRiCE²S Cruise Kick-Off — 5 January 2029</p>

      <div id="countdown" class="countdown-grid" role="timer" aria-live="polite" aria-label="Time remaining until WRiCE²S Cruise Kick-Off">
        <div class="countdown-block">
          <span class="countdown-value" id="days">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-block">
          <span class="countdown-value" id="hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-block">
          <span class="countdown-value" id="minutes">00</span>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-block">
          <span class="countdown-value" id="seconds">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>

      <p id="countdown-complete" class="complete-message" hidden>
        The WRiCE²S Cruise is underway.
      </p>

      <p class="fine-print">Target time is fixed to Walvis Bay, Namibia (UTC+2) and displays consistently for every visitor, regardless of local time zone.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
