<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WRiCE</title>

  <style>
    :root {
      --bg: #081821;
      --text: #f4f7f8;
      --muted: rgba(244, 247, 248, 0.62);
      --accent: #7fd8d2;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      width: min(92vw, 1100px);
      padding: 3rem 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 0.9;
    }

    .acronym {
      margin: 0.8rem 0 3rem;
      font-size: clamp(0.68rem, 1.2vw, 0.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .science {
      margin: 0 0 2.5rem;
      font-size: clamp(1.25rem, 2.8vw, 1.9rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .exploration {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 4vw, 3.5rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1.05;
    }

    .plus {
      margin: 0.45rem 0 0.55rem;
      font-size: clamp(1.25rem, 2.4vw, 1.8rem);
      font-weight: 300;
      color: var(--accent);
    }

    .capacity {
      margin: 0;
      font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
      font-size: clamp(1.55rem, 3.4vw, 2.9rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.08;
    }

    .region {
      margin: 2.6rem 0 0;
      font-size: clamp(0.85rem, 1.8vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .acronym {
        margin-bottom: 2.4rem;
        letter-spacing: 0.04em;
      }
      .science { letter-spacing: 0.12em; }
      .region { letter-spacing: 0.16em; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>WRiCE</h1>
    <p class="acronym">Walvis Ridge Discovery &amp; Capacity Strengthening Expedition</p>
    <p class="science">South–South deep-sea science</p>
    <p class="exploration">Exploration</p>
    <div class="plus">+</div>
    <p class="capacity">Capacity strengthening</p>
    <p class="region">Across the South Atlantic</p>
  </main>
</body>
</html>
